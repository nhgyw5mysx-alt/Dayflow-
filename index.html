<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DayFlow</title>
  <meta name="theme-color" content="#c7bba0" />
  <link rel="manifest" href="data:application/manifest+json,{
    &quot;name&quot;:&quot;DayFlow&quot;,
    &quot;short_name&quot;:&quot;DayFlow&quot;,
    &quot;start_url&quot;:&quot;.&quot;,
    &quot;display&quot;:&quot;standalone&quot;,
    &quot;background_color&quot;:&quot;#c7bba0&quot;,
    &quot;theme_color&quot;:&quot;#ceac90&quot;,
    &quot;icons&quot;:[
      {&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ceac90' rx='20'/%3E%3Ctext x='50' y='60' font-size='50' text-anchor='middle' fill='white'%3E✦%3C/text%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}
    ]
  }" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ceac90;
      --secondary: #c7bba0;
      --text: #000000;
      --light: #f5f0eb;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--secondary);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--primary);
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .tab {
      font-size: 1.1rem;
      padding: 10px 14px;
      cursor: pointer;
      border-radius: 20px;
      transition: all 0.3s ease;
    }
    .tab.active {
      background: white;
      color: var(--primary);
      font-weight: bold;
    }
    .container {
      position: relative;
      width: 100%;
      height: calc(100vh - 120px);
      overflow: hidden;
    }
    .section {
      position: absolute;
      inset: 0;
      padding: 20px;
      background: var(--light);
      border-radius: 20px 20px 0 0;
      opacity: 0;
      visibility: hidden;
      transform: translateX(100%);
      transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.5s ease;
      overflow-y: auto;
    }
    .section.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }
    .section.prev {
      transform: translateX(-100%);
    }
    h2 { margin-bottom: 20px; color: var(--primary); text-align: center; }

    /* Shared button style */
    .clear-btn, #add-job-btn, #export-pdf-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 1rem;
      margin: 10px 5px;
    }

    /* Notes */
    #notes-text {
      width: 100%;
      height: 90%;
      padding: 15px;
      border: none;
      background: white;
      border-radius: 15px;
      font-size: 1.1rem;
      resize: none;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
    }

    /* Schedule */
    #task-input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 15px;
      font-size: 1.1rem;
      margin-bottom: 15px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
    }
    .task-item {
      display: flex;
      align-items: center;
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .task-item.done {
      opacity: 0.6;
      text-decoration: line-through;
      background: #f0e6dc;
    }
    .task-item input[type="checkbox"] {
      width: 24px;
      height: 24px;
      margin-right: 15px;
      accent-color: var(--primary);
    }
    .schedule-controls {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Jobs */
    .job-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .job-input, .hours-input, .job-notes {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 15px;
      font-size: 1.1rem;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
    }
    .hours-input { width: 100%; }
    .job-item {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .job-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .job-timestamp {
      font-size: 0.9rem;
      color: #555;
    }
    .jobs-controls {
      text-align: center;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1 style="color:white; font-size:1.8rem;">DayFlow</h1>
    <div class="tabs">
      <div class="tab active" data-section="notes">Notes</div>
      <div class="tab" data-section="schedule">Schedule</div>
      <div class="tab" data-section="jobs">Jobs</div>
    </div>
  </header>

  <div class="container">
    <section id="notes" class="section active">
      <h2>Today's Notes & Reminders</h2>
      <textarea id="notes-text" placeholder="Jot down anything..."></textarea>
    </section>

    <section id="schedule" class="section">
      <h2>Today's Tasks</h2>
      <input type="text" id="task-input" placeholder="Add a new task..." />
      <div class="schedule-controls">
        <button class="clear-btn" id="clear-completed">Clear Completed</button>
        <button class="clear-btn" id="clear-all-tasks">Clear All</button>
      </div>
      <ul id="task-list"></ul>
    </section>

    <section id="jobs" class="section">
      <h2>Job Time Log</h2>
      <div class="job-form">
        <input type="text" id="job-name" class="job-input" placeholder="Job name..." />
        <input type="number" id="job-hours" class="hours-input" placeholder="Hours (e.g. 2.5)" min="0" step="0.1" />
        <textarea id="job-notes" class="job-notes" placeholder="Additional notes..."></textarea>
        <button id="add-job-btn">Add Job</button>
      </div>
      <div class="jobs-controls">
        <button class="clear-btn" id="clear-all-jobs">Clear All Jobs</button>
        <button id="export-pdf-btn">Export Timesheet PDF</button>
      </div>
      <ul id="job-list"></ul>
    </section>
  </div>

  <script src="https://unpkg.com/idb@7/build/umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script>
    const { jsPDF } = window.jspdf;

    const dbPromise = idb.openDB('DayFlowDB', 1, {
      upgrade(db) {
        db.createObjectStore('data', { keyPath: 'id' });
      }
    });

    async function saveData(id, value) {
      const db = await dbPromise;
      await db.put('data', { id, value });
    }

    async function loadData(id, defaultValue = '') {
      const db = await dbPromise;
      const item = await db.get('data', id);
      return item ? item.value : defaultValue;
    }

    // Notes
    const notesText = document.getElementById('notes-text');
    notesText.addEventListener('input', () => saveData('notes', notesText.value));

    // Schedule
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');
    const clearCompletedBtn = document.getElementById('clear-completed');
    const clearAllTasksBtn = document.getElementById('clear-all-tasks');

    async function loadTasks() {
      const tasks = await loadData('tasks', []);
      renderTasks(tasks);
      return tasks;
    }

    function renderTasks(tasks) {
      taskList.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.innerHTML = `
          <input type="checkbox" ${task.done ? 'checked' : ''}>
          <span class="task-text">${task.text}</span>
        `;
        li.querySelector('input').addEventListener('change', () => {
          tasks[index].done = !tasks[index].done;
          saveData('tasks', tasks);
          renderTasks(tasks);
        });
        taskList.appendChild(li);
      });
    }

    taskInput.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter' && taskInput.value.trim()) {
        const tasks = await loadData('tasks', []);
        tasks.push({ text: taskInput.value.trim(), done: false });
        await saveData('tasks', tasks);
        taskInput.value = '';
        renderTasks(tasks);
      }
    });

    clearCompletedBtn.addEventListener('click', async () => {
      let tasks = await loadData('tasks', []);
      tasks = tasks.filter(t => !t.done);
      await saveData('tasks', tasks);
      renderTasks(tasks);
    });

    clearAllTasksBtn.addEventListener('click', async () => {
      if (confirm('Clear all tasks?')) {
        await saveData('tasks', []);
        renderTasks([]);
      }
    });

    // Jobs
    const jobName = document.getElementById('job-name');
    const jobHours = document.getElementById('job-hours');
    const jobNotes = document.getElementById('job-notes');
    const addJobBtn = document.getElementById('add-job-btn');
    const jobList = document.getElementById('job-list');
    const clearAllJobsBtn = document.getElementById('clear-all-jobs');
    const exportPdfBtn = document.getElementById('export-pdf-btn');

    async function loadJobs() {
      const jobs = await loadData('jobs', []);
      jobs.sort((a, b) => b.timestamp - a.timestamp);
      renderJobs(jobs);
      return jobs;
    }

    function renderJobs(jobs) {
      jobList.innerHTML = '';
      jobs.forEach(job => {
        const li = document.createElement('li');
        li.className = 'job-item';
        const date = new Date(job.timestamp).toLocaleString();
        li.innerHTML = `
          <div class="job-header">
            <span>${job.job}</span>
            <span>${job.hours} hours</span>
          </div>
          <div class="job-timestamp">${date}</div>
          <div class="job-details">${job.notes || '<em>No notes</em>'}</div>
        `;
        jobList.appendChild(li);
      });
    }

    addJobBtn.addEventListener('click', async () => {
      if (jobName.value.trim() && jobHours.value >= 0) {
        const jobs = await loadData('jobs', []);
        jobs.push({
          timestamp: Date.now(),
          job: jobName.value.trim(),
          hours: parseFloat(jobHours.value),
          notes: jobNotes.value.trim()
        });
        await saveData('jobs', jobs);
        jobName.value = ''; jobHours.value = ''; jobNotes.value = '';
        loadJobs();
      }
    });

    clearAllJobsBtn.addEventListener('click', async () => {
      if (confirm('Delete all job entries? This cannot be undone.')) {
        await saveData('jobs', []);
        renderJobs([]);
      }
    });

    exportPdfBtn.addEventListener('click', async () => {
      const jobs = await loadJobs();
      if (jobs.length === 0) {
        alert('No jobs to export!');
        return;
      }

      const doc = new jsPDF();

      // Header with color
      doc.setFillColor('#ceac90');
      doc.rect(0, 0, 210, 40, 'F');
      doc.setTextColor('#ffffff');
      doc.setFontSize(22);
      doc.text('DayFlow Timesheet', 105, 25, { align: 'center' });

      doc.setTextColor('#000000');
      doc.setFontSize(12);
      doc.text(`Exported on: ${new Date().toLocaleDateString()}`, 105, 35, { align: 'center' });

      // Prepare table data
      const tableData = jobs.map(job => {
        const date = new Date(job.timestamp).toLocaleString();
        return [job.job, `${job.hours} hrs`, date, job.notes || ''];
      });

      let totalHours = jobs.reduce((sum, job) => sum + job.hours, 0);

      // AutoTable
      doc.autoTable({
        head: [['Job', 'Hours', 'Date & Time', 'Notes']],
        body: tableData,
        startY: 50,
        theme: 'grid',
        headStyles: { fillColor: '#ceac90', textColor: '#ffffff', fontStyle: 'bold' },
        styles: { fontSize: 11, cellPadding: 5 },
        columnStyles: {
          0: { cellWidth: 50 },
          1: { cellWidth: 25, halign: 'center' },
          2: { cellWidth: 45 },
          3: { cellWidth: 60 } // Notes wrap automatically
        },
        didDrawPage: (data) => {
          // Add total at the bottom of the last page
          if (data.pageNumber === doc.internal.getNumberOfPages()) {
            doc.setFontSize(14);
            doc.setFontStyle('bold');
            doc.text(`Total Hours: ${totalHours.toFixed(2)}`, 105, data.settings.startY + data.table.height + 10, { align: 'center' });
          }
        }
      });

      doc.save('DayFlow_Timesheet.pdf');
    });

    // Smooth navigation
    const tabs = document.querySelectorAll('.tab');
    const sections = document.querySelectorAll('.section');
    let currentSection = document.querySelector('.section.active');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetId = tab.dataset.section;
        const targetSection = document.getElementById(targetId);

        if (targetSection === currentSection) return;

        document.querySelector('.tab.active').classList.remove('active');
        tab.classList.add('active');

        currentSection.classList.remove('active');
        if (Array.from(sections).indexOf(targetSection) > Array.from(sections).indexOf(currentSection)) {
          currentSection.classList.add('prev');
        }

        targetSection.classList.add('active');
        targetSection.classList.remove('prev');

        currentSection = targetSection;
      });
    });

    // Load data
    (async () => {
      notesText.value = await loadData('notes');
      await loadTasks();
      await loadJobs();
    })();
  </script>
</body>
</html>
